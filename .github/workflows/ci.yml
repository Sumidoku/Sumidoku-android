name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # caches the wrapper distribution and build cache between runs
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # AGP would install missing components itself, but pinning keeps the build
      # reproducible: compileSdk 37 is a minor-versioned platform
      - name: Install SDK platform
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"

      # JVM tests only, no emulator: the generated OpenAPI client decodes real
      # captured payloads, and the coroutine / reachability guards are pure JVM
      - name: Run unit tests
        run: ./gradlew test --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      # The release build type is unsigned without KEYSTORE_FILE, but building it
      # on every change keeps the release configuration (proguard, signing hook)
      # from rotting unnoticed
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --console=plain
