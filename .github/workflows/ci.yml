name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # caches the wrapper distribution and build cache between runs
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # AGP would install missing components itself, but pinning keeps the build
      # reproducible: compileSdk 37 is a minor-versioned platform
      - name: Install SDK platform
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"

      # `core:image` builds the ncnn+Vulkan waifu2x engine from C++: the NDK and CMake versions
      # are pinned in that module's build file and must match what CI installs here.
      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"

      # The prebuilt ncnn SDK is downloaded (and sha256-verified) by fetchNcnnSdk; cache it so
      # repeat builds skip the ~40 MB fetch.
      - name: Cache ncnn SDK
        uses: actions/cache@v4
        with:
          path: third_party/ncnn
          key: ncnn-20260113-android-vulkan-${{ runner.os }}

      # JVM tests only, no emulator: the generated OpenAPI client decodes real
      # captured payloads, and the coroutine / reachability guards are pure JVM
      - name: Run unit tests
        run: ./gradlew test --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      # The release build type is unsigned without KEYSTORE_FILE, but building it
      # on every change keeps the release configuration (proguard, signing hook)
      # from rotting unnoticed
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --console=plain
