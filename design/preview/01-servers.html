<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>服务器 · sumidoku-android 设计稿</title>
<link rel="stylesheet" href="assets/mock.css">
</head>
<body>
<h1 class="page-title">服务器</h1>
<p class="page-sub">多实例管理 · API key 凭据 · 连接状态</p>
<div class="phone">
  <div class="statusbar"><span>21:30</span><span class="icons">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 17h4v4H2zM8 13h4v8H8zM14 9h4v12h-4zM20 5h2v16h-2z"/></svg>
    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="7" width="15" height="10" rx="2"/><rect x="5" y="9" width="9" height="6" fill="#0A0A0E"/></svg>
  </span></div>

  <div class="appbar"><span class="title">服务器</span></div>

  <div class="content">
    <div class="listitem" style="border:1px solid rgba(168,181,255,.4);border-radius:var(--radius);padding:14px;margin-bottom:10px;background:var(--accent-soft)">
      <div class="grow">
        <div class="name" style="font-weight:600">家里的 NAS <span class="tag acc">当前</span></div>
        <div class="sub">https://sumidoku.example.com</div>
        <div class="sub">v0.23.0 · <span style="color:var(--success)">已连接 · 128 ms</span></div>
      </div>
      <span class="iconbtn"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></span>
    </div>
    <div class="listitem" style="border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px">
      <div class="grow">
        <div class="name">备用实例</div>
        <div class="sub">http://192.168.1.20:4578</div>
        <div class="sub" style="color:var(--error)">离线 · 上次同步 3 天前</div>
      </div>
      <span class="iconbtn"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></span>
    </div>

    <div style="margin-top:22px">
      <div class="sech" style="margin-top:0"><b>添加服务器</b></div>
      <div class="setgroup">
        <div class="setitem"><div class="grow"><div class="t" style="color:var(--faint)">地址</div><div class="s">https://…:4578</div></div></div>
        <div class="setitem"><div class="grow"><div class="t" style="color:var(--faint)">API Key</div><div class="s">服务器 设置 → 系统 → API keys 生成</div></div></div>
      </div>
      <div class="btnrow"><span class="btn" style="flex:1">测试并保存</span></div>
      <p style="font-size:11.5px;color:var(--faint);margin-top:12px;line-height:1.6">
        凭据以 API key（bearer）保存在本机安全存储；GET /api/v1/version 无需认证，用于连通性与版本检查。
      </p>
    </div>
  </div>
</div>
</body>
</html>
