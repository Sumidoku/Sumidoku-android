<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>下载 · sumidoku-android 设计稿</title>
<link rel="stylesheet" href="assets/mock.css">
</head>
<body>
<h1 class="page-title">下载</h1>
<p class="page-sub">服务端队列（SSE 实时）/ 本机离线（Tier B）双 tab</p>
<div class="phone">
  <div class="statusbar"><span>21:35</span><span class="icons">
    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="7" width="15" height="10" rx="2"/><rect x="5" y="9" width="9" height="6" fill="#0A0A0E"/></svg>
  </span></div>

  <div class="appbar">
    <span class="title">下载</span>
    <span class="iconbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v5l3 2"/><circle cx="12" cy="12" r="9"/></svg></span>
  </div>

  <div class="content">
    <div class="chips">
      <span class="chip active">服务端队列</span>
      <span class="chip">本机离线</span>
    </div>

    <div class="listitem">
      <span class="cover g4"><span class="ct"></span></span>
      <div class="grow">
        <div class="name">我独自升级 · 第 201 话</div>
        <div class="sub">下载中 · 14 / 32 页 · 2.1 MB/s</div>
        <div class="pbar" style="margin-top:6px"><i style="width:44%"></i></div>
      </div>
      <span class="tail">⏸</span>
    </div>
    <div class="listitem">
      <span class="cover g1"><span class="ct"></span></span>
      <div class="grow">
        <div class="name">青之驱魔师 · 第 148 话</div>
        <div class="sub">排队中 · 拷贝漫画（源内串行，位置 2）</div>
      </div>
      <span class="tail">⋯</span>
    </div>
    <div class="listitem">
      <span class="cover g2"><span class="ct"></span></span>
      <div class="grow">
        <div class="name">葬送的芙莉莲 · 第 132 话</div>
        <div class="sub" style="color:var(--success)">已完成 · 31 页 · 18.4 MB</div>
      </div>
      <span class="tail ok">✓</span>
    </div>
    <div class="listitem">
      <span class="cover g5"><span class="ct"></span></span>
      <div class="grow">
        <div class="name">链锯人 · 第 178 话</div>
        <div class="sub" style="color:var(--error)">失败 · 第 9 页 HTTP 429 · 点击重试</div>
      </div>
      <span class="tail">↻</span>
    </div>

    <div class="sech"><b>章节页缓存</b><span>管理</span></div>
    <div style="background:var(--surface);border-radius:var(--radius);padding:14px">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px">
        <span>已缓存 42 章</span><span style="color:var(--muted)">1.2 / 2.0 GiB</span>
      </div>
      <div class="pbar"><i style="width:60%"></i></div>
    </div>
  </div>

  <div class="bottomnav">
    <span class="tab"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13z"/></svg></span>书库</span>
    <span class="tab"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m15 9-2 5-4 1 2-5z"/></svg></span>浏览</span>
    <span class="tab"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v5l3 2"/><circle cx="12" cy="12" r="9"/></svg></span>更新</span>
    <span class="tab"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></span>历史</span>
    <span class="tab"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg></span>设置</span>
  </div>
</div>
</body>
</html>
