<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>浏览 · sumidoku-android 设计稿</title>
<link rel="stylesheet" href="assets/mock.css">
</head>
<body>
<h1 class="page-title">浏览 · 图源</h1>
<p class="page-sub">置顶排序 / 启用开关 / 图源仓库管理</p>
<div class="phone">
  <div class="statusbar"><span>21:31</span><span class="icons">
    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="7" width="15" height="10" rx="2"/><rect x="5" y="9" width="9" height="6" fill="#0A0A0E"/></svg>
  </span></div>

  <div class="appbar">
    <span class="title">浏览</span>
    <span class="iconbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg></span>
  </div>

  <div class="content">
    <div class="chips">
      <span class="chip active">已置顶</span>
      <span class="chip">全部</span>
      <span class="chip">中文</span>
      <span class="chip">英文</span>
      <span class="chip">仓库</span>
    </div>

    <div class="listitem">
      <span class="cover g1" style="width:38px;aspect-ratio:1;border-radius:9px"></span>
      <div class="grow"><div class="name">拷贝漫画</div><div class="sub">zh · WASM 源 · 📌</div></div>
      <span class="sw on"></span>
    </div>
    <div class="listitem">
      <span class="cover g3" style="width:38px;aspect-ratio:1;border-radius:9px"></span>
      <div class="grow"><div class="name">本地漫画</div><div class="sub">内置 local 源 · 3 个实例</div></div>
      <span class="iconbtn" title="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg></span>
    </div>
    <div class="listitem">
      <span class="cover g5" style="width:38px;aspect-ratio:1;border-radius:9px"></span>
      <div class="grow"><div class="name">MangaDex</div><div class="sub">en · WASM 源 · 📌</div></div>
      <span class="sw on"></span>
    </div>
    <div class="listitem">
      <span class="cover g4" style="width:38px;aspect-ratio:1;border-radius:9px"></span>
      <div class="grow"><div class="name">Komga（书源）</div><div class="sub">内置 OPDS 源 · 需登录 <span class="tag warn">未登录</span></div></div>
      <span class="iconbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg></span>
    </div>
    <div class="listitem">
      <span class="cover g2" style="width:38px;aspect-ratio:1;border-radius:9px"></span>
      <div class="grow"><div class="name">禁漫天堂</div><div class="sub">zh · WASM 源 · 已停用</div></div>
      <span class="sw"></span>
    </div>

    <div class="sech"><b>图源仓库</b><span>管理</span></div>
    <div class="listitem">
      <div class="grow"><div class="name" style="font-size:13.5px">community-sources</div><div class="sub">https://…/index.min.json · 87 个源 · 2 个可更新</div></div>
      <span class="tag acc">2 更新</span>
    </div>
  </div>

  <div class="bottomnav">
    <span class="tab"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13z"/></svg></span>书库</span>
    <span class="tab active"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m15 9-2 5-4 1 2-5z"/></svg></span>浏览</span>
    <span class="tab"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v5l3 2"/><circle cx="12" cy="12" r="9"/></svg></span>更新</span>
    <span class="tab"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></span>历史</span>
    <span class="tab"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg></span>设置</span>
  </div>
</div>
</body>
</html>
