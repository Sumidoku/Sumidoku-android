<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>条漫阅读器 · sumidoku-android 设计稿</title>
<link rel="stylesheet" href="assets/mock.css">
<style>
  /* 加载中：页盒内居中旋转弧（对齐 webui .reader__img--loading，accent 色弧） */
  .pg-loading { display: flex; align-items: center; justify-content: center; background: var(--surface); }
  .pg-loading svg { animation: pgspin .8s linear infinite; }
  @keyframes pgspin { to { transform: rotate(360deg); } }
  /* 失败：槽位保留宽高比盒，重试按钮在槽内（连续模式，对齐 webui FailedPage retryInOverlay=false） */
  .pg-failed { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: var(--surface); color: #6b7280; font-size: 13px; }
</style>
</head>
<body>
<h1 class="page-title">阅读器 · 条漫（Webtoon）· 页面状态</h1>
<p class="page-sub">连续滚动三态同框：正常页 / 加载中（已知宽高比 → 页盒内居中 accent 弧，对齐 .reader__img--loading）/ 失败（自动重试 1 次仍败 → 槽内 图标+文案+重试按钮，连续模式不重开覆盖层）</p>
<div class="phone">
  <div class="reader-canvas" style="background:#0C0C10;overflow:hidden">
    <div style="padding:0">
      <div style="height:250px;background:linear-gradient(170deg,#33384C,#20232F);margin:0 0 2px"></div>
      <div class="pg-loading" style="height:200px;margin:0 0 2px">
        <svg width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="none" stroke="#A8B5FF" stroke-width="3" stroke-linecap="round" stroke-dasharray="56.5 18.9"/></svg>
      </div>
      <div class="pg-failed" style="height:230px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
        页面加载失败
        <span class="btn" style="padding:7px 18px;font-size:12.5px">重试</span>
      </div>
    </div>
    <div style="position:absolute;right:8px;top:30%;bottom:30%;width:4px;border-radius:99px;background:rgba(255,255,255,.14)">
      <div style="position:absolute;top:0;left:0;right:0;height:38%;background:var(--accent);border-radius:99px"></div>
    </div>
    <div style="position:absolute;right:16px;top:44%;font-size:10px;color:var(--muted);writing-mode:vertical-rl">7 / 24</div>
  </div>

  <div class="reader-overlay-top">
    <div style="display:flex;align-items:center;gap:10px">
      <span class="iconbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg></span>
      <div style="flex:1;min-width:0">
        <div style="font-size:14.5px;font-weight:600">我独自升级</div>
        <div style="font-size:11.5px;color:var(--muted)">第 201 话 · 条漫 · 7 / 24</div>
      </div>
      <span class="iconbtn"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></span>
    </div>
  </div>

  <div class="reader-overlay-bottom">
    <div class="slider" style="margin-bottom:10px">
      <span>1</span>
      <div class="track"><i style="width:29%"></i><u style="left:29%"></u></div>
      <span>24</span>
    </div>
    <div style="display:flex;justify-content:space-around;color:var(--muted)">
      <span class="iconbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg></span>
      <span class="iconbtn" style="color:var(--accent)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="3" width="12" height="18" rx="1.5"/><path d="M6 8h12M6 14h12"/></svg></span>
      <span class="iconbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v16m0 0-4-4m4 4 4-4"/></svg></span>
      <span class="iconbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l-.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg></span>
    </div>
  </div>
</div>
</body>
</html>
