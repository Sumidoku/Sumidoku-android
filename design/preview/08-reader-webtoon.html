<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>条漫阅读器 · 可拖拽滚动条 · sumidoku-android 设计稿</title>
<link rel="stylesheet" href="assets/mock.css">
<style>
  /* 加载中：页盒内居中旋转弧（对齐 webui .reader__img--loading，accent 色弧） */
  .pg-loading { display: flex; align-items: center; justify-content: center; background: var(--surface); }
  .pg-loading svg { animation: pgspin .8s linear infinite; }
  @keyframes pgspin { to { transform: rotate(360deg); } }
  /* 失败：槽位保留宽高比盒，重试按钮在槽内（连续模式，对齐 webui FailedPage retryInOverlay=false） */
  .pg-failed { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: var(--surface); color: #6b7280; font-size: 13px; }
  /* 可拖拽滚动条（对齐 Komikku Webtoon 条漫滚动条）：触控热区 24dp，thumb 拖动态放大，
     拖动时左侧浮出页码气泡；轨道刻度 = 各话起止锚点 */
  .sb-hot { position: absolute; right: 2px; top: 12%; bottom: 12%; width: 24px; }
  .sb-track { position: absolute; right: 10px; top: 0; bottom: 0; width: 5px; border-radius: 99px; background: rgba(255,255,255,.13); }
  .sb-tick { position: absolute; right: 9px; width: 7px; height: 2px; border-radius: 2px; background: rgba(255,255,255,.35); }
  .sb-thumb { position: absolute; right: 7px; top: 30%; width: 11px; height: 64px; border-radius: 99px;
    background: var(--accent); box-shadow: 0 2px 10px rgba(0,0,0,.5); }
  .sb-bubble { position: absolute; right: 34px; top: 34%; font-size: 11.5px; font-weight: 700;
    color: var(--text); background: rgba(38,38,51,.95); border: 1px solid var(--border);
    border-radius: 99px; padding: 5px 12px; }
  .sb-bubble small { display: block; font-weight: 500; font-size: 10px; color: var(--muted); }
  /* 底栏与分页模式共用同一章节导航器 */
  .chapnav { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .navpill {
    flex: 1; display: flex; align-items: center; gap: 10px;
    background: rgba(38,38,51,.92); border: 1px solid var(--border);
    border-radius: 99px; padding: 7px 12px; font-size: 12px; color: var(--muted);
  }
  .navpill .cur { color: var(--text); font-weight: 700; min-width: 14px; text-align: center; }
  .navpill .track { flex: 1; height: 4px; border-radius: 99px; background: var(--surface3); position: relative; }
  .navpill .track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 99px; }
  .navpill .track u { position: absolute; top: 50%; width: 13px; height: 13px; border-radius: 50%; background: var(--accent); transform: translate(-50%, -50%); }
  .chapnav .iconbtn { background: rgba(38,38,51,.92); border: 1px solid var(--border); width: 40px; height: 40px; color: var(--text); }
  .chapnav .iconbtn svg { width: 18px; height: 18px; }
</style>
</head>
<body>
<h1 class="page-title">阅读器 · 条漫 · 可拖拽滚动条（页面三态同框）</h1>
<p class="page-sub">条漫/连续滚动没有「翻页方向」可言，底栏只保留 章节 / 模式 / 设置 三键（对齐 Aidoku webtoon 的精简底栏）；右缘滚动条可拖拽：24dp 触控热区、拖动时 thumb 放大、左侧浮出「7 / 24 · 第 201 话」气泡、轨道刻度标记各话起止；页面三态不变（正常 / 加载中弧 / 失败槽内重试）</p>
<div class="phone">
  <div class="reader-canvas" style="background:#0C0C10;overflow:hidden">
    <div style="padding:0">
      <div style="height:250px;background:linear-gradient(170deg,#33384C,#20232F);margin:0 0 2px"></div>
      <div class="pg-loading" style="height:200px;margin:0 0 2px">
        <svg width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="none" stroke="#A8B5FF" stroke-width="3" stroke-linecap="round" stroke-dasharray="56.5 18.9"/></svg>
      </div>
      <div class="pg-failed" style="height:230px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
        页面加载失败
        <span class="btn" style="padding:7px 18px;font-size:12.5px">重试</span>
      </div>
    </div>
    <div class="sb-hot">
      <div class="sb-track"></div>
      <div class="sb-tick" style="top:0"></div>
      <div class="sb-tick" style="top:45%"></div>
      <div class="sb-tick" style="top:78%"></div>
      <div class="sb-thumb"></div>
    </div>
    <div class="sb-bubble">7 / 24<small>第 201 话</small></div>
  </div>

  <div class="reader-overlay-top">
    <div style="display:flex;align-items:center;gap:10px">
      <span class="iconbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg></span>
      <div style="flex:1;min-width:0">
        <div style="font-size:14.5px;font-weight:600">我独自升级</div>
        <div style="font-size:11.5px;color:var(--muted)">第 201 话 · 条漫 · 7 / 24</div>
      </div>
      <span class="iconbtn"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></span>
    </div>
  </div>

  <div class="reader-overlay-bottom">
    <div class="chapnav">
      <span class="iconbtn" title="上一章"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M17 6l-6 6 6 6M11 6l-6 6 6 6"/></svg></span>
      <div class="navpill">
        <span class="cur">7</span>
        <div class="track"><i style="width:29%"></i><u style="left:29%"></u></div>
        <span>/ 24</span>
      </div>
      <span class="iconbtn" title="下一章"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M7 6l6 6-6 6M13 6l6 6-6 6"/></svg></span>
    </div>
    <div style="display:flex;justify-content:space-around;color:var(--muted)">
      <span class="iconbtn" title="章节列表"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg></span>
      <span class="iconbtn" style="color:var(--accent)" title="阅读模式：条漫（长按切回 分页 / 连续滚动）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="3" width="12" height="18" rx="1.5"/><path d="M6 8h12M6 14h12"/></svg></span>
      <span class="iconbtn" title="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg></span>
    </div>
  </div>
</div>
</body>
</html>
