<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图源主页 · sumidoku-android 设计稿</title>
<link rel="stylesheet" href="assets/mock.css">
</head>
<body>
<h1 class="page-title">图源主页</h1>
<p class="page-sub">动态组件行（listing 横滑）· NDJSON 渐进渲染</p>
<div class="phone">
  <div class="statusbar"><span>21:32</span><span class="icons">
    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="7" width="15" height="10" rx="2"/><rect x="5" y="9" width="9" height="6" fill="#0A0A0E"/></svg>
  </span></div>

  <div class="appbar">
    <span class="iconbtn back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg></span>
    <span class="title" style="font-size:18px">拷贝漫画</span>
    <span class="iconbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg></span>
    <span class="iconbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg></span>
  </div>

  <div class="content">
    <div class="hscroll-title"><b>热门连载</b><span>listing · 查看全部 ›</span></div>
    <div class="hscroll">
      <div><div class="cover g1"><span class="ct">我推的孩子</span></div><div class="name">我推的孩子</div></div>
      <div><div class="cover g4"><span class="ct">咒术回战</span></div><div class="name">咒术回战</div></div>
      <div><div class="cover g6"><span class="ct">胆大党</span></div><div class="name">胆大党</div></div>
      <div><div class="cover g3"><span class="ct">坂本日常</span></div><div class="name">坂本日常</div></div>
    </div>

    <div class="hscroll-title"><b>最新上架</b><span>listing · 查看全部 ›</span></div>
    <div class="hscroll">
      <div><div class="cover g5"><span class="ct">废渊战鬼</span></div><div class="name">废渊战鬼</div></div>
      <div><div class="cover g2"><span class="ct">瑠璃龙龙</span></div><div class="name">瑠璃龙龙</div></div>
      <div><div class="cover g4"><span class="ct">神乐钵</span></div><div class="name">神乐钵</div></div>
      <div><div class="cover g1"><span class="ct">正义使者</span></div><div class="name">正义使者</div></div>
    </div>

    <div class="hscroll-title"><b>专题推荐</b><span>component · scroller</span></div>
    <div style="border-radius:12px;background:linear-gradient(120deg,#2A3A5C,#3A2A4C);height:88px;display:flex;align-items:center;padding:0 18px">
      <div><div style="font-size:15px;font-weight:700">本周编辑精选</div><div style="font-size:11.5px;color:var(--muted);margin-top:4px">12 部作品 · 每周一更新</div></div>
    </div>

    <div class="hscroll-title"><b>分类浏览</b></div>
    <div class="chips" style="flex-wrap:wrap">
      <span class="chip">热血</span><span class="chip">恋爱</span><span class="chip">奇幻</span>
      <span class="chip">悬疑</span><span class="chip">日常</span><span class="chip">科幻</span>
    </div>
  </div>

  <div class="bottomnav">
    <span class="tab"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13z"/></svg></span>书库</span>
    <span class="tab active"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m15 9-2 5-4 1 2-5z"/></svg></span>浏览</span>
    <span class="tab"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v5l3 2"/><circle cx="12" cy="12" r="9"/></svg></span>更新</span>
    <span class="tab"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></span>历史</span>
    <span class="tab"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg></span>设置</span>
  </div>
</div>
</body>
</html>
