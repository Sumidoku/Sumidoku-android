<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分页阅读器 · 方向元数据 · sumidoku-android 设计稿</title>
<link rel="stylesheet" href="assets/mock.css">
<style>
  /* 对齐 webui：.reader__img-failed（槽位保留宽高比盒）+ .reader__page-retry（点按区域之上居中覆盖） */
  .pg-failed { width: 74%; aspect-ratio: 5/7; background: var(--surface); border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #6b7280; font-size: 13px; }
  .pg-retry-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .pg-retry-overlay .btn { pointer-events: auto; transform: translateY(64px); box-shadow: 0 4px 16px rgba(0,0,0,.45); }
  .pg-note { position: absolute; top: 64px; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; }
  .pg-note span { font-size: 10.5px; color: var(--muted); background: rgba(20,22,30,.85); border: 1px solid var(--border); border-radius: 99px; padding: 4px 10px; }
  /* 章节导航器（对齐 Komikku ChapterNavigator）：上一章/页码滑杆胶囊/下一章一体成型 */
  .chapnav { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .navpill {
    flex: 1; display: flex; align-items: center; gap: 10px;
    background: rgba(38,38,51,.92); border: 1px solid var(--border);
    border-radius: 99px; padding: 7px 12px; font-size: 12px; color: var(--muted);
  }
  .navpill .cur { color: var(--text); font-weight: 700; min-width: 14px; text-align: center; }
  /* 页码宽度变化时不跳：透明总页数占位由 .ph 承担（Komikku 同款做法） */
  .navpill .track { flex: 1; height: 4px; border-radius: 99px; background: var(--surface3); position: relative; }
  .navpill .track i { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 99px; }
  .navpill .track u { position: absolute; top: 50%; width: 13px; height: 13px; border-radius: 50%; background: var(--accent); transform: translate(50%, -50%); }
  .chapnav .iconbtn { background: rgba(38,38,51,.92); border: 1px solid var(--border); width: 40px; height: 40px; color: var(--text); }
  .chapnav .iconbtn svg { width: 18px; height: 18px; }
  /* 底栏图标状态角标：布局=自动 / 方向=跟随元数据 */
  .iconbtn.has-dot { position: relative; }
  .iconbtn.has-dot::after { content: ""; position: absolute; top: 8px; right: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px rgba(10,10,14,.9); }
  .dirchip { font-size: 10px; color: var(--muted); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; margin-left: 6px; }
</style>
</head>
<body>
<h1 class="page-title">阅读器 · 分页 · 方向元数据 + 布局状态可见（页面失败态同框）</h1>
<p class="page-sub">方向来自 <code>manga.viewer</code>（本机 = 右→左）：滑杆进度从右向左填充、上一章/下一章按钮对调、点按区预览镜像，顶栏副标题标出「右→左」；底栏布局图标带「自动」角标、方向图标带「跟随元数据」圆点。页面失败态不变——槽位保留宽高比盒，重试按钮覆盖在点按区域之上</p>
<div class="phone">
  <div class="reader-canvas">
    <div class="reader-page">
      <div class="pg-failed">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
        页面加载失败
        <span style="font-size:10.5px;color:var(--faint)">第 7 页 · 已自动重试 1 次</span>
      </div>
    </div>
    <div class="pg-note"><span>点按区域覆盖整页（见 24 屏），失败页的重试只能盖在区域之上</span></div>
    <div class="pg-retry-overlay"><span class="btn">重试</span></div>
  </div>

  <div class="reader-overlay-top">
    <div style="display:flex;align-items:center;gap:10px">
      <span class="iconbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg></span>
      <div style="flex:1;min-width:0">
        <div style="font-size:14.5px;font-weight:600">葬送的芙莉莲</div>
        <div style="font-size:11.5px;color:var(--muted)">第 89 话 · 7 / 24<span class="dirchip">右→左</span></div>
      </div>
      <span class="iconbtn" title="无痕"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l18 18M10.6 5.1A9.8 9.8 0 0 1 12 5c5 0 9.3 3.1 11 7.5a13 13 0 0 1-2.7 4M6.6 6.6A12.6 12.6 0 0 0 1 12.5c1.7 4.4 6 7.5 11 7.5 1.5 0 3-.3 4.3-.8"/></svg></span>
      <span class="iconbtn"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></span>
    </div>
  </div>

  <div class="reader-overlay-bottom">
    <div class="chapnav">
      <!-- RTL：上一章在右、下一章在左；胶囊内滑杆从右往左生长 -->
      <span class="iconbtn" title="下一章" style="order:3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M7 6l6 6-6 6M13 6l6 6-6 6"/></svg></span>
      <div class="navpill">
        <span class="cur">7</span>
        <div class="track"><i style="right:0;width:29%"></i><u style="right:29%"></u></div>
        <span>/ 24</span>
      </div>
      <span class="iconbtn" title="上一章" style="order:1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M17 6l-6 6 6 6M11 6l-6 6 6 6"/></svg></span>
    </div>
    <div style="display:flex;justify-content:space-around;color:var(--muted)">
      <span class="iconbtn" title="章节列表"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg></span>
      <span class="iconbtn" title="阅读模式：分页（长按切换 连续滚动 / 条漫）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M8 3v18"/></svg></span>
      <span class="iconbtn has-dot" title="布局：自动（横屏双页，可切 单页 / 双页）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="5" width="9" height="14" rx="1.5"/><rect x="12.5" y="5" width="9" height="14" rx="1.5"/></svg></span>
      <span class="iconbtn has-dot" title="方向：跟随漫画元数据（右→左）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 7h13m0 0-3-3m3 3-3 3M16 17H3m0 0 3 3m-3-3 3-3"/></svg></span>
      <span class="iconbtn" title="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg></span>
    </div>
  </div>
</div>
</body>
</html>
