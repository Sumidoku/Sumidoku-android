<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>书库 · sumidoku-android 设计稿</title>
<link rel="stylesheet" href="assets/mock.css">
<style>
  .filterbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .cat-select {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent-soft); color: var(--accent);
    border: 1px solid rgba(168,181,255,.35); border-radius: 9px;
    padding: 7px 12px; font-size: 13px; font-weight: 600;
  }
  .sheet .catrow { display: flex; align-items: center; justify-content: space-between; padding: 12px 2px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .sheet .catrow:last-child { border-bottom: 0; }
  .sheet .catrow.active { color: var(--accent); font-weight: 600; }
  .sheet .catrow .cnt { color: var(--faint); font-size: 12px; }
  .sheet .catrow.active .cnt { color: var(--accent); }
  .dim { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
</style>
</head>
<body>
<h1 class="page-title">书库</h1>
<p class="page-sub">分类收进下拉弹层（含未读数），不再横向滚动；过滤组并入同一弹层</p>
<div class="phone">
  <div class="statusbar"><span>21:30</span><span class="icons">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 17h4v4H2zM8 13h4v8H8zM14 9h4v12h-4zM20 5h2v16h-2z"/></svg>
    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="7" width="15" height="10" rx="2"/><rect x="5" y="9" width="9" height="6" fill="#0A0A0E"/></svg>
  </span></div>

  <div class="appbar">
    <span class="title">书库</span>
    <span class="iconbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg></span>
    <span class="iconbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M10 18h4"/></svg></span>
    <span class="iconbtn"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></span>
  </div>

  <div class="content">
    <div class="filterbar">
      <span class="cat-select">连载中 ▾</span>
      <span style="flex:1"></span>
      <span class="iconbtn" title="排序"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4v13m0 0-3-3m3 3 3-3M17 20V7m0 0-3 3m3-3 3 3"/></svg></span>
      <span class="iconbtn" title="过滤组"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.3 1.1 6-5.4-2.9-5.4 2.9 1.1-6L3.2 9.4l6.1-.8z"/></svg></span>
    </div>

    <div class="grid">
      <div><div class="cover g1"><span class="ubadge">12</span><span class="dlbadge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 21h16"/></svg></span><span class="ct">青之驱魔师</span></div><div class="name">青之驱魔师</div><div class="sub">第 148 话 · 拷贝漫画</div></div>
      <div><div class="cover g2"><span class="ubadge">3</span><span class="ct">葬送的芙莉莲</span></div><div class="name">葬送的芙莉莲</div><div class="sub">第 132 话 · 拷贝漫画</div></div>
      <div><div class="cover g4"><span class="ubadge">27</span><span class="ct">我独自升级</span></div><div class="name">我独自升级</div><div class="sub">第 201 话 · Bato</div></div>
      <div><div class="cover g5"><span class="ct">链锯人</span></div><div class="name">链锯人</div><div class="sub">第 178 话 · 禁漫天堂</div></div>
      <div><div class="cover g6"><span class="ubadge">1</span><span class="ct">间谍过家家</span></div><div class="name">间谍过家家</div><div class="sub">第 105 话 · 拷贝漫画</div></div>
      <div><div class="cover g2"><span class="ct">怪兽 8 号</span></div><div class="name">怪兽 8 号</div><div class="sub">第 118 话 · MangaDex</div></div>
    </div>

    <div class="dim"></div>
    <div class="sheet">
      <div class="grab"></div>
      <div style="font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px">分类 <span style="color:var(--accent);float:right">过滤组 ›</span></div>
      <div class="catrow"><span>全部</span><span class="cnt">214</span></div>
      <div class="catrow"><span>未分类</span><span class="cnt">12</span></div>
      <div class="catrow active"><span>连载中</span><span class="cnt">87 · 44 未读</span></div>
      <div class="catrow"><span>日漫</span><span class="cnt">96</span></div>
      <div class="catrow"><span>韩漫</span><span class="cnt">19</span></div>
    </div>
  </div>

  <div class="bottomnav">
    <span class="tab active"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg></span>书库</span>
    <span class="tab"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m15 9-2 5-4 1 2-5z"/></svg></span>浏览</span>
    <span class="tab"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v5l3 2"/><circle cx="12" cy="12" r="9"/></svg></span>更新</span>
    <span class="tab"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></span>历史</span>
    <span class="tab"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg></span>设置</span>
  </div>
</div>
</body>
</html>
