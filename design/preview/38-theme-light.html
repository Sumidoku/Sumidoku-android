<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>主题档 · 浅色 · sumidoku-android 设计稿</title>
<link rel="stylesheet" href="assets/mock.css">
<style>
  /* 浅色档：补齐设计稿缺口（代码侧 SumidokuTheme 已实现浅色方案，此处定稿视觉） */
  .phone.light {
    --bg: #FAFAFC;
    --surface: #FFFFFF;
    --surface2: #F1F1F7;
    --surface3: #E4E4EE;
    --border: #DBDBE6;
    --text: #191921;
    --muted: #565670;
    --faint: #8A8A9E;
    --accent: #4A55C4;
    --accent-soft: rgba(74,85,196,.12);
    color: #191921;
  }
  .phone.light .ubadge { color: #FFFFFF; }
  .phone.light .btn { color: #FFFFFF; }
  .phone.light .sw.on::after { background: #FFFFFF; }
  .phone.light .dlbadge { background: rgba(255,255,255,.55); color: #1E7A46; }
  .filterbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .cat-select {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent-soft); color: var(--accent);
    border: 1px solid rgba(74,85,196,.35); border-radius: 9px;
    padding: 7px 12px; font-size: 13px; font-weight: 600;
  }
  .themebanner {
    display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 12px; font-size: 12px; color: var(--muted);
  }
  .themebanner b { color: var(--text); font-size: 13px; }
  .themebanner .sw { margin-left: auto; }
</style>
</head>
<body>
<h1 class="page-title">主题档 · 浅色</h1>
<p class="page-sub">主题 = 跟随系统 / 浅色 / 深色（+AMOLED 开关，见 37）：浅色板 primary #4A55C4、底 #FAFAFC，封面占位渐变与角标对比度已按浅色调校</p>
<div class="phone light">
  <div class="statusbar"><span>21:30</span><span class="icons">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 17h4v4H2zM8 13h4v8H8zM14 9h4v12h-4zM20 5h2v16h-2z"/></svg>
    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="7" width="15" height="10" rx="2"/><rect x="5" y="9" width="9" height="6" fill="#FAFAFC"/></svg>
  </span></div>

  <div class="appbar">
    <span class="title">书库</span>
    <span class="iconbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg></span>
    <span class="iconbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M10 18h4"/></svg></span>
    <span class="iconbtn"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></span>
  </div>

  <div class="content">
    <div class="themebanner">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
      <div><b>浅色主题</b><br>跟随系统 / 浅色 / 深色 三档 + AMOLED 开关</div>
      <span class="sw on"></span>
    </div>

    <div class="filterbar">
      <span class="cat-select">连载中 ▾</span>
      <span style="flex:1"></span>
      <span class="iconbtn" title="显示"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
      <span class="iconbtn" title="排序"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4v13m0 0-3-3m3 3 3-3M17 20V7m0 0-3 3m3-3 3 3"/></svg></span>
      <span class="iconbtn" title="过滤组"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.3 1.1 6-5.4-2.9-5.4 2.9 1.1-6L3.2 9.4l6.1-.8z"/></svg></span>
    </div>

    <div class="cgrid">
      <div class="cover g1"><span class="ubadge">12</span><span class="dlbadge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 21h16"/></svg></span><span class="ct">青之驱魔师</span></div>
      <div class="cover g2"><span class="ubadge">3</span><span class="ct">葬送的芙莉莲</span></div>
      <div class="cover g4"><span class="ubadge">27</span><span class="ct">我独自升级</span></div>
      <div class="cover g5"><span class="ct">链锯人</span></div>
      <div class="cover g6"><span class="ubadge">1</span><span class="ct">间谍过家家</span></div>
      <div class="cover g2"><span class="ct">怪兽 8 号</span></div>
    </div>
  </div>

  <div class="bottomnav">
    <span class="tab active"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg></span>书库</span>
    <span class="tab"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m15 9-2 5-4 1 2-5z"/></svg></span>浏览</span>
    <span class="tab"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v5l3 2"/><circle cx="12" cy="12" r="9"/></svg></span>更新</span>
    <span class="tab"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></span>历史</span>
    <span class="tab"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg></span>设置</span>
  </div>
</div>
</body>
</html>
