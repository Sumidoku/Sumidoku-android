<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>备选封面 · sumidoku-android 设计稿</title>
<link rel="stylesheet" href="assets/mock.css">
<style>
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
  .cgrid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
  .cgrid .cover { aspect-ratio: 2/3; width: 100%; }
  .cgrid .sel { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cgrid .ckb { position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: #10131F; font-size: 12px; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<h1 class="page-title">备选封面（详情页 ⋯ → 更换封面）</h1>
<p class="page-sub">CoverPickerModal · GET /manga/{id}/covers/alternates → PUT 选定 · 封面缓存按变体隔离</p>
<div class="phone">
  <div class="statusbar"><span>21:41</span><span class="icons">
    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="7" width="15" height="10" rx="2"/><rect x="5" y="9" width="9" height="6" fill="#0A0A0E"/></svg>
  </span></div>
  <div class="content" style="opacity:.5;padding-top:8px">
    <div style="display:flex;gap:14px">
      <div class="cover g2" style="width:108px;aspect-ratio:2/3"><span class="ct">葬送的芙莉莲</span></div>
      <div style="flex:1"><div style="font-size:18px;font-weight:700">葬送的芙莉莲</div></div>
    </div>
  </div>
  <div class="scrim"></div>

  <div class="sheet" style="max-height:600px;overflow:hidden">
    <div class="grab"></div>
    <div style="display:flex;align-items:center;margin-bottom:12px">
      <b style="font-size:16px">更换封面</b>
      <span style="margin-left:auto;color:var(--faint)">✕</span>
    </div>
    <div class="cgrid">
      <div class="cover g2 sel"><span class="ckb">✓</span><span class="ct">当前 · 图源封面</span></div>
      <div class="cover g5"><span class="ct">备选 1 · 卷 1</span></div>
      <div class="cover g1"><span class="ct">备选 2 · 卷 12</span></div>
      <div class="cover g3"><span class="ct">备选 3 · 彩页</span></div>
      <div class="cover g4"><span class="ct">备选 4 · 书腰</span></div>
      <div class="cover g6"><span class="ct">备选 5 · 特典</span></div>
    </div>
    <div class="btnrow" style="margin-top:14px">
      <span class="btn ghost" style="flex:1">取消</span>
      <span class="btn" style="flex:1">使用这张</span>
    </div>
    <div style="font-size:11px;color:var(--faint);margin-top:8px;line-height:1.6">
      选定后服务端把该变体标记为当前封面；书库/历史等处 ?v= 版本号自动刷新。
    </div>
  </div>
</div>
</body>
</html>
